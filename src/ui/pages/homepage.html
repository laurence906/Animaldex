<!DOCTYPE html>
<html>

    <head>
        <Title>Animaldex</Title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <link rel="stylesheet" href="homepage.css">
    </head>

    <body>

        <div class="container">

            <h1 class="title">
                Animaldex - Submit an Image!
            </h1>

            <form action="/upload" method="POST" enctype="multipart/form-data>">

                <input type="file" name="image" id="image_input" placeholder="Upload" accept="image/*">

                <button type="submit">
                    Submit Image
                </button>
            </form>

        </div>

    </body>

</html>
