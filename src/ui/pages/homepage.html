<!DOCTYPE html>
<html>

    <head>
        <Title>Animaldex</Title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="homepage.css">
    </head>

    <body>

        <div class="container">

            <h1 class="title">
                Animaldex - Submit an Image!
            </h1>

            <div class= "format">

                <div class= "Visual">

                    <div class= "dex">

                            <div class="dex-hinge"></div>
                            <div class="dex-body"></div>

                    </div>

                </div>

                <div class="upload_container">
                    
                    <form action="/upload" method="POST" enctype="multipart/form-data">

                        <input type="file" name="image" id="image_input" placeholder="Upload" accept="image/*">

                        <button type="submit">
                            Submit Image
                        </button>

                    </form>

                </div>

            </div>

            <div class="nav_buttons">

                <p>
                    <a href= "accountinfo.html">Account</a>
                </p>

            </div>
        
        </div>

    </body>

</html>
